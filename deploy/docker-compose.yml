version: '3.8'

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: corporate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corporate"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ../back  # ← указываем путь к папке back
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:123@db:5432/corporate
    restart: always

  frontend:
    build: ../front # ← указываем путь к папке front
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data: